<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BugScope AI — Report</title>
<style>
body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0}
header{background:#1e293b;padding:16px 24px}h1{margin:0;font-size:20px}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.card{background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px}
.prob{font-size:22px;font-weight:700}.high{color:#f87171}.med{color:#fbbf24}.low{color:#34d399}
.meta{color:#94a3b8;font-size:13px}.bar{height:8px;background:#334155;border-radius:4px;margin:8px 0}
.fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.tag{display:inline-block;background:#334155;padding:2px 10px;border-radius:99px;font-size:12px;margin-right:6px}
</style></head><body>
<header><h1>🎯 BugScope AI — Scan Report</h1></header>
<main id="app"><p>Loading...</p></main>
<script>
fetch("report.json").then(r=>r.json()).then(data=>{
  const app=document.getElementById("app");
  app.innerHTML=`<p class="meta">${data.length} endpoints scored. Hunt top-down.</p>`+
  data.map(e=>{
    const p=e.top_probability, cls=p>=0.6?"high":p>=0.35?"med":"low";
    const bars=Object.entries(e.scores).map(([k,v])=>
      `<div class="meta">${k}: ${(v*100).toFixed(0)}%</div><div class="bar"><div class="fill" style="width:${v*100}%"></div></div>`).join("");
    return `<div class="card"><span class="prob ${cls}">${(p*100).toFixed(0)}%</span>
      <span class="tag">${e.top_vuln}</span><span class="tag">${e.method}</span><span class="tag">${e.source}</span>
      <div style="margin:6px 0;word-break:break-all">${e.url}</div>${bars}</div>`;
  }).join("");
});
</script></body></html>
